<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#021826">
  <title>Boundless Blue</title>
  <meta name="description" content="An endless, procedurally generated underwater journey rendered in real time in your browser.">
  <style>
    html, body { margin: 0; height: 100%; background: #021826; overflow: hidden; cursor: none; touch-action: manipulation; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #loader { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; color: #cfeef8;
      background: radial-gradient(ellipse at 50% 12%, #0e5f82 0%, #06324a 38%, #021826 75%); transition: opacity 2.5s ease; z-index: 5; }
    #loader h1 { margin: 0; font: 200 clamp(28px, 5vw, 64px)/1 Georgia, 'Times New Roman', serif; letter-spacing: .42em;
      text-transform: uppercase; padding-left: .42em; text-shadow: 0 4px 30px rgba(0, 30, 60, .7); }
    #loader p { margin: 1.4em 0 0; font: 300 13px/1.6 system-ui, sans-serif; letter-spacing: .32em; text-transform: uppercase; opacity: .7; }
    #ld-track { width: min(320px, 60vw); height: 2px; margin: 1.6em auto 0; background: rgba(207,238,248,.16); border-radius: 2px; overflow: hidden; }
    #ld-bar { height: 100%; background: linear-gradient(90deg, #6fd3ee, #cfeef8); transform: scaleX(0); transform-origin: left; transition: transform .35s ease-out; box-shadow: 0 0 8px #6fd3ee; }
    /* while the scripts download (before main.js sets the bar's style) it creeps a little, so it never looks stuck */
    #ld-bar:not([style]) { animation: ld-wait 8s cubic-bezier(.2, .7, .3, 1) forwards; }
    @keyframes ld-wait { to { transform: scaleX(.08); } }
    #loader #ld-pct { margin-top: .9em; font-size: 11px; letter-spacing: .2em; opacity: .45; font-variant-numeric: tabular-nums; }
    #loader .rays { position: absolute; inset: 0; pointer-events: none; opacity: .35;
      background: repeating-linear-gradient(105deg, transparent 0 60px, rgba(180, 235, 255, .07) 60px 90px, transparent 90px 170px);
      mask-image: linear-gradient(to bottom, #000, transparent 70%); -webkit-mask-image: linear-gradient(to bottom, #000, transparent 70%);
      animation: drift 9s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translateX(-30px); } to { transform: translateX(30px); } }
    /* one line where it fits; on a phone they wrap inside the screen (max-content: a fixed box at left 50% would
       otherwise wrap at half the screen width) */
    #note { position: fixed; left: 50%; bottom: 4.5vh; transform: translateX(-50%); color: #dff4fb; opacity: 0;
      font: italic 300 clamp(12px, 1.25vw, 16px)/1.3 Georgia, serif; letter-spacing: .08em; transition: opacity 2.5s, translate .35s ease;
      text-shadow: 0 2px 12px rgba(0, 20, 40, .9); pointer-events: none;
      width: max-content; max-width: calc(100vw - 24px); text-align: center; text-wrap: balance; }
    #caption { position: fixed; left: 50%; bottom: 9vh; transform: translateX(-50%); color: #e6f6fb;
      font: 200 clamp(18px, 2.6vw, 34px)/1 Georgia, 'Times New Roman', serif; letter-spacing: .35em;
      text-transform: uppercase; opacity: 0; transition: opacity 3s, translate .35s ease; pointer-events: none;
      text-shadow: 0 2px 18px rgba(0, 20, 40, .8); width: max-content; max-width: calc(100vw - 24px); text-align: center; text-wrap: balance; }
    #caption small { display: block; margin-top: .7em; font-size: .38em; letter-spacing: .4em; opacity: .75; text-align: center; }
    #stats { position: fixed; left: calc(10px + env(safe-area-inset-left, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); z-index: 3;
      color: #bfe; font: 12px monospace; white-space: pre; display: none; pointer-events: none; padding: 6px 8px; border-radius: 6px;
      background: rgba(2, 16, 22, .55); }
    #labels { position: fixed; inset: 0; pointer-events: none; display: none; }
    #labels .lbl { position: absolute; left: 0; top: 0; white-space: nowrap; font: 500 12px/1 system-ui, sans-serif;
      color: #effbff; text-shadow: 0 1px 3px rgba(0, 15, 30, .9), 0 0 8px rgba(0, 15, 30, .6); }
    #labels .dot { position: absolute; left: -3px; top: -3px; width: 6px; height: 6px; border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .85); }
    #labels .txt { position: absolute; left: 7px; top: -18px; padding: 2px 6px; border-radius: 3px;
      background: rgba(2, 30, 48, .45); border-left: 1px solid rgba(255, 255, 255, .6); }
    #labels .fact { position: absolute; left: 7px; top: 6px; width: max-content; max-width: 280px; white-space: normal; display: none;
      font: italic 400 11px/1.35 Georgia, serif; color: #d9f2fa; padding: 3px 6px; border-radius: 3px;
      background: rgba(2, 30, 48, .5); border-left: 1px solid rgba(255, 255, 255, .35); }

    /* ---------- control deck (src/hud.js): instrument glass, brass bezels, teal and amber ---------- */
    :root {
      --dk-teal: #62f0dc; --dk-teal2: #2fb3a6; --dk-tdim: rgba(140, 232, 220, .66); --dk-amber: #ffb54a; --dk-rose: #ff6fae;
      --dk-text: #ddf8f4; --dk-line: rgba(217, 181, 108, .26);
      --dk-glass: linear-gradient(180deg, rgba(8, 40, 50, .78), rgba(2, 15, 21, .86));
      --dk-brass: linear-gradient(140deg, #ecd08f 0%, #8a6630 26%, #d9b56f 50%, #6b4a1f 76%, #cfa960 100%);
      --dk-mono: ui-monospace, 'SF Mono', 'Cascadia Mono', 'Roboto Mono', Menlo, Consolas, 'Liberation Mono', monospace;
      --dk-sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      --dk-serif: Georgia, 'Times New Roman', serif;
      --dk-pad: 10px; --dk-gap: 10px; --dk-sheet-w: 410px;
      /* --dk-top-m / --dk-bar-m: measured by hud.js (top row and bottom bar heights, incl. padding and safe area) */
      --dk-top-m: 130px; --dk-bar-m: 86px;
      /* --dk-cap-x/-w/-fs (no sheet) and -xs/-ws/-fss (sheet open): caption centre, free span and type cap, from hud.js */
      --dk-cap-x: 50vw; --dk-cap-w: 100vw; --dk-cap-fs: 34px; --dk-cap-xs: 50vw; --dk-cap-ws: 100vw; --dk-cap-fss: 34px;
      --sa-t: env(safe-area-inset-top, 0px); --sa-r: env(safe-area-inset-right, 0px);
      --sa-b: env(safe-area-inset-bottom, 0px); --sa-l: env(safe-area-inset-left, 0px);
    }
    #deck { position: fixed; inset: 0; z-index: 4; pointer-events: none; display: grid; gap: var(--dk-gap);
      padding: calc(var(--dk-pad) + var(--sa-t)) calc(var(--dk-pad) + var(--sa-r)) calc(var(--dk-pad) + var(--sa-b)) calc(var(--dk-pad) + var(--sa-l));
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas: "nav compass time" "depth . right" "bar bar bar";
      font: 400 12px/1.25 var(--dk-sans); color: var(--dk-text); -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent; opacity: 0; visibility: hidden; transition: opacity .3s ease, visibility 0s linear .3s; }
    #deck.open { opacity: 1; visibility: visible; transition: opacity .25s ease, visibility 0s; }
    #deck:not(.open) * { animation-play-state: paused !important; }
    #deck canvas { width: 100%; height: 100%; } /* overrides the page-wide canvas rule */
    :where(#deck) button { font: inherit; color: inherit; background: none; border: 0; margin: 0; padding: 0; cursor: pointer; text-align: inherit;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    #deck button:focus-visible, #dk-toast:focus-visible { outline: 2px solid var(--dk-amber); outline-offset: 2px; }
    :where(#deck) b { font-weight: 600; }
    .dk-i { width: 22px; height: 22px; display: block; flex: none; }
    .dk-k { font: 650 9.5px/1 var(--dk-sans); letter-spacing: .17em; text-transform: uppercase; color: var(--dk-tdim); white-space: nowrap; }
    .dk-big { font: 600 20px/1 var(--dk-mono); color: var(--dk-teal); text-shadow: 0 0 9px rgba(98, 240, 220, .45);
      font-variant-numeric: tabular-nums; white-space: nowrap; }
    /* panels: dark instrument glass in a brass bezel, faint scanlines, corner rivets */
    .dk-p, .dk-sheet, #dk-toast, .dk-pb { border: 1.5px solid transparent; border-radius: 14px; background: var(--dk-glass) padding-box, var(--dk-brass) border-box;
      box-shadow: 0 8px 26px rgba(0, 8, 16, .45), inset 0 1px 0 rgba(255, 255, 255, .07), inset 0 0 0 1px rgba(0, 0, 0, .55); }
    .dk-p { pointer-events: auto; position: relative; padding: 9px 11px; cursor: default; contain: layout paint;
      transition: transform .35s cubic-bezier(.2, .7, .2, 1); }
    .dk-p::before, .dk-sheet::before { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(140, 255, 240, .035) 0 1px, transparent 1px 3px); }
    .dk-p::after { content: ''; position: absolute; inset: 3px; pointer-events: none;
      --rv: radial-gradient(circle, #f2d99c 0 1px, #6b4a1f 1.4px, transparent 2px);
      background: var(--rv) left top / 5px 5px no-repeat, var(--rv) right top / 5px 5px no-repeat,
        var(--rv) left bottom / 5px 5px no-repeat, var(--rv) right bottom / 5px 5px no-repeat; }
    #deck:not(.open) .dk-nav { transform: translate(-12px, -8px); }
    #deck:not(.open) .dk-compass { transform: translateY(-12px); }
    #deck:not(.open) .dk-time { transform: translate(12px, -8px); }
    #deck:not(.open) .dk-depth { transform: translateX(-14px); }
    #deck:not(.open) .dk-right > * { transform: translateX(14px); }
    #deck:not(.open) .dk-helm, #deck:not(.open) .dk-quick, #deck:not(.open) .dk-menu { transform: translateY(12px); }
    /* buttons */
    .dk-btn { min-width: 46px; height: 46px; border-radius: 12px; display: inline-grid; place-items: center; place-content: center; color: var(--dk-teal);
      background: radial-gradient(circle at 50% 28%, rgba(98, 240, 220, .17), rgba(98, 240, 220, .03) 70%), rgba(0, 0, 0, .28);
      box-shadow: inset 0 0 0 1px rgba(98, 240, 220, .33), inset 0 -2px 0 rgba(0, 0, 0, .45); transition: background .15s, transform .1s, box-shadow .15s; }
    #deck .dk-btn:active, #deck .dk-opt:active, #deck .dk-wbtn:active, #deck .dk-zt:active, #deck .dk-tog:active { transform: scale(.96); }
    .dk-btn[aria-pressed="true"], .dk-btn[aria-expanded="true"], #dk-lampq.on { color: #1d1405; background: linear-gradient(#ffd283, #e8962c);
      box-shadow: 0 0 12px rgba(255, 181, 74, .55), inset 0 0 0 1px rgba(255, 225, 170, .85); }
    .dk-btn[hidden] { display: none; }
    .dk-mb { width: 52px; height: 50px; gap: 3px; padding-top: 2px; }
    .dk-hb { height: 50px; gap: 3px; padding: 2px 4px 0; box-sizing: border-box; }
    .dk-mb span, .dk-hb span { font: 700 8.5px/1 var(--dk-sans); letter-spacing: .12em; white-space: nowrap; } /* 7.5px on phones */
    /* quick settings: labels carry the state (LAMPS AUTO, MUTED), so the buttons size to them */
    .dk-quick .dk-mb { width: auto; min-width: 52px; padding: 2px 5px 0; box-sizing: border-box; }
    #dk-lampq.off, #dk-snd.off { color: var(--dk-tdim); }
    @media (hover: hover) {
      .dk-btn:hover, .dk-opt:hover, .dk-wbtn:hover, .dk-tog:hover, .dk-mini:hover, .dk-seg button:hover { background-color: rgba(98, 240, 220, .1); }
      .dk-navbtn:hover .dk-zone, .dk-clockbtn:hover .dk-big, .dk-wxbtn:hover .dk-wxl, .dk-chip:hover b, .dk-lampbtn:hover b { color: #fff; }
    }
    /* navigation card */
    .dk-nav { grid-area: nav; justify-self: start; align-self: start; width: clamp(220px, 26vw, 320px); padding: 0; }
    .dk-navbtn { display: grid; gap: 4px; width: 100%; padding: 10px 13px 8px; }
    .dk-led { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: .5px; background: var(--dk-teal);
      box-shadow: 0 0 6px var(--dk-teal); animation: dk-blink 2.4s ease-in-out infinite; }
    @keyframes dk-blink { 50% { opacity: .25; } }
    .dk-zone { font: 400 20px/1.1 var(--dk-serif); letter-spacing: .05em; color: #f2fffc; text-shadow: 0 0 14px rgba(98, 240, 220, .35);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dk-sub { font: italic 12px/1.2 var(--dk-serif); color: var(--dk-tdim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dk-prog { display: block; height: 4px; margin-top: 3px; border-radius: 2px; overflow: hidden; background: rgba(98, 240, 220, .14); }
    .dk-prog i { display: block; height: 100%; transform-origin: left; transform: scaleX(0);
      background: linear-gradient(90deg, var(--dk-teal2), var(--dk-teal)); box-shadow: 0 0 6px var(--dk-teal); }
    .dk-nextl { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dk-tdim); }
    .dk-nextl b { color: var(--dk-amber); margin: 0 3px; }
    .dk-trip { display: flex; border-top: 1px solid var(--dk-line); }
    .dk-tv { flex: 1 1 0; min-width: 0; display: grid; gap: 4px; padding: 7px 10px 8px; min-height: 44px; align-content: center; }
    .dk-tv + .dk-tv { border-left: 1px solid var(--dk-line); }
    .dk-tv b { font: 600 13px/1 var(--dk-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .dk-chip b { color: var(--dk-amber); }
    /* compass tape, attitude ball, watching */
    .dk-compass { grid-area: compass; justify-self: center; align-self: start; width: clamp(230px, 36vw, 520px); padding: 7px 10px 8px; display: grid; gap: 5px; }
    .dk-tape { position: relative; height: 34px; overflow: hidden; border-radius: 7px; background: rgba(0, 0, 0, .38); box-shadow: inset 0 0 0 1px rgba(98, 240, 220, .22); }
    .dk-tape::before, .dk-tape::after { content: ''; position: absolute; top: 0; bottom: 0; width: 18%; z-index: 1; pointer-events: none; }
    .dk-tape::before { left: 0; background: linear-gradient(90deg, rgba(3, 20, 27, .95), transparent); }
    .dk-tape::after { right: 0; background: linear-gradient(270deg, rgba(3, 20, 27, .95), transparent); }
    .dk-tape canvas { position: absolute; inset: 0; display: block; }
    .dk-lubber { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; z-index: 2; background: var(--dk-amber); box-shadow: 0 0 6px var(--dk-amber); }
    .dk-lubber::before { content: ''; position: absolute; left: -4px; top: 0; border: 5px solid transparent; border-top-color: var(--dk-amber); }
    .dk-hdgrow { display: flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; }
    .dk-hdgrow .dk-big { font-size: 18px; min-width: 3.1em; }
    .dk-card { font: 700 12px/1 var(--dk-sans); color: var(--dk-amber); letter-spacing: .08em; min-width: 2.7em; }
    .dk-hdgrow > b:last-child { font: 600 13px/1 var(--dk-mono); min-width: 3em; }
    .dk-pk { margin-left: 4px; }
    .dk-att { position: relative; width: 26px; height: 26px; border-radius: 50%; overflow: hidden; flex: none; margin-right: 3px; background: #0a2a33;
      box-shadow: 0 0 0 1.5px rgba(217, 181, 108, .85), inset 0 0 4px #000; }
    .dk-att i { position: absolute; left: -4px; right: -4px; top: -20px; bottom: -20px;
      background: linear-gradient(180deg, #3aa4c0 0 50%, #123a32 50% 100%); }
    .dk-att b { position: absolute; left: 4px; right: 4px; top: 50%; height: 1.5px; margin-top: -.75px; background: var(--dk-amber); }
    .dk-watch { display: flex; justify-content: center; align-items: baseline; gap: 8px; min-width: 0; visibility: hidden; opacity: 0; transition: opacity .4s; }
    .dk-watch.on { visibility: visible; opacity: 1; }
    .dk-watch b { font: italic 600 13px/1.2 var(--dk-serif); color: var(--dk-amber); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    /* time and weather */
    .dk-time { grid-area: time; justify-self: end; align-self: start; display: flex; padding: 0; width: clamp(210px, 22vw, 290px); }
    .dk-clockbtn { flex: 1.35 1 0; min-width: 0; display: flex; align-items: center; gap: 9px; padding: 8px 10px; min-height: 44px; }
    .dk-clock { position: relative; width: 44px; height: 44px; flex: none; }
    .dk-face { width: 100%; height: 100%; display: block; }
    .dk-fbz { fill: none; stroke: #b8924f; stroke-width: 2; }
    .dk-fgl { fill: rgba(0, 0, 0, .35); stroke: rgba(98, 240, 220, .25); stroke-width: 1; }
    .dk-fticks path { stroke: rgba(170, 250, 240, .75); stroke-width: 1.3; stroke-linecap: round; }
    .dk-hand { position: absolute; left: 50%; bottom: 50%; transform-origin: 50% 100%; border-radius: 2px; }
    .dk-hh { width: 2.6px; height: 11px; margin-left: -1.3px; background: #eafffb; }
    .dk-mh { width: 1.8px; height: 16px; margin-left: -.9px; background: var(--dk-teal); box-shadow: 0 0 4px var(--dk-teal); }
    .dk-hub { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%; background: var(--dk-amber); }
    .dk-tcol { display: grid; gap: 5px; min-width: 0; }
    .dk-tod { display: flex; gap: 5px; align-items: center; font: 700 10px/1 var(--dk-sans); letter-spacing: .14em; text-transform: uppercase; color: var(--dk-amber); white-space: nowrap; }
    .dk-g .dk-i { width: 16px; height: 16px; }
    .dk-wxbtn { flex: 1 1 0; min-width: 0; display: grid; justify-items: center; align-content: center; gap: 5px; padding: 8px 6px; min-height: 44px;
      text-align: center; border-left: 1px solid var(--dk-line); }
    #deck .dk-wxbtn .dk-i { width: 22px; height: 22px; color: var(--dk-teal); }
    .dk-wxl { font: 700 9.5px/1.15 var(--dk-sans); letter-spacing: .1em; text-transform: uppercase; }
    /* depth gauge */
    .dk-depth { grid-area: depth; justify-self: start; align-self: start; height: 100%; max-height: 440px; box-sizing: border-box;
      display: grid; grid-template-columns: 58px auto; grid-template-rows: auto minmax(90px, 1fr); grid-template-areas: "t t" "g r"; gap: 6px 10px; padding: 9px 11px 10px; }
    .dk-ct { grid-area: t; }
    .dk-dg { grid-area: g; position: relative; min-height: 90px; }
    .dk-band { position: absolute; right: 0; width: 15px; }
    .dk-band.z0 { background: linear-gradient(#7fe3f0, #1d86a6); border-radius: 4px 4px 0 0; }
    .dk-band.z1 { background: linear-gradient(#1d6f93, #143f6a); }
    .dk-band.z2 { background: linear-gradient(#162f5c, #0a1434); }
    .dk-band.z3 { background: #04050d; box-shadow: inset 0 0 0 1px rgba(98, 240, 220, .18); }
    .dk-band.z4 { background: #000; border-radius: 0 0 4px 4px; box-shadow: inset 0 0 0 1px rgba(160, 140, 255, .3); }
    .dk-bl { position: absolute; right: 0; width: 15px; transform: translateY(-50%); writing-mode: vertical-rl; text-orientation: mixed;
      font: 700 7px/15px var(--dk-sans); letter-spacing: .16em; text-align: center; color: rgba(255, 255, 255, .72); pointer-events: none; }
    .dk-bl:first-of-type { color: rgba(0, 30, 40, .7); }
    .dk-tk { position: absolute; right: 21px; transform: translateY(-50%); font: 500 9px/1 var(--dk-mono); color: rgba(170, 240, 232, .72); }
    .dk-tk::after { content: ''; position: absolute; right: -6px; top: 50%; width: 4px; height: 1px; background: rgba(170, 240, 232, .6); }
    .dk-mk { position: absolute; left: 0; right: 0; top: 0; height: 100%; pointer-events: none; }
    .dk-mk i { position: absolute; right: -3px; top: 0; }
    .dk-dmk i { width: 24px; height: 2px; margin-top: -1px; background: var(--dk-amber); box-shadow: 0 0 6px var(--dk-amber); }
    .dk-dmk i::before { content: ''; position: absolute; left: -7px; top: -5px; border: 6px solid transparent; border-left: 7px solid var(--dk-amber); border-right: 0; }
    .dk-smk { display: none; }
    .dk-smk.on { display: block; }
    .dk-smk i { width: 21px; height: 3px; margin-top: -1.5px; background: #c58a45; box-shadow: 0 0 4px rgba(197, 138, 69, .8); }
    .dk-dread { grid-area: r; display: grid; align-content: start; gap: 7px; min-width: 76px; }
    .dk-dread .dk-big { font-size: 18px; }
    .dk-dzone { justify-self: start; font: 750 8.5px/1.15 var(--dk-sans); letter-spacing: .12em; padding: 3px 5px; border-radius: 4px; color: #062028; background: #7fe3f0; }
    .dk-dzone.z1 { background: #2a7fa8; color: #e8fbff; }
    .dk-dzone.z2 { background: #22336e; color: #dfe6ff; }
    .dk-dzone.z3 { background: #0a0c1c; color: #c9d2ff; box-shadow: inset 0 0 0 1px rgba(150, 170, 255, .45); }
    .dk-dzone.z4 { background: #000; color: #d9ccff; box-shadow: inset 0 0 0 1px rgba(180, 150, 255, .55); }
    .dk-row { display: grid; gap: 3px; }
    .dk-row b { font: 600 12.5px/1 var(--dk-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
    /* right column: sonar and environment */
    .dk-right { grid-area: right; justify-self: end; align-self: start; display: grid; gap: var(--dk-gap); width: clamp(186px, 17vw, 232px);
      max-height: 100%; overflow: hidden; pointer-events: none; }
    .dk-sonar { display: grid; gap: 4px; padding: 9px 9px 7px; }
    .dk-scope { position: relative; aspect-ratio: 1 / 1; border-radius: 50%; padding: 3px; background: var(--dk-brass); box-shadow: 0 0 0 1px rgba(0, 0, 0, .6), 0 0 18px rgba(98, 240, 220, .12); }
    .dk-scope canvas { display: block; border-radius: 50%; }
    .dk-sonrow { display: flex; justify-content: space-between; align-items: center; gap: 6px; }

  <script>
    // If the app's modules fail to load or link, the title card would sit at 0% forever. The usual cause is a
    // browser mixing files cached before an update with new ones (GitHub Pages lets each file be cached for
    // 10 minutes). Then re-fetch every script from the network and reload once; if it still fails, show the error.
    (function () {
      var err = '', KEY = 'boundlessBlue.retried';
      addEventListener('error', function (e) {
        if (!err) err = e.message || (e.target && e.target.src ? 'could not load ' + e.target.src : 'a script failed');
      }, true);
      addEventListener('load', function () {
        setTimeout(function () {
          var retried = false;
          try { retried = sessionStorage.getItem(KEY) === '1'; } catch (e) { /* private mode */ }
          if (window.__ocean && window.__ocean.ready) { try { sessionStorage.removeItem(KEY); } catch (e) { /* ignore */ } return; }
          var txt = document.getElementById('ld-txt');
          if (!retried) {
            try { sessionStorage.setItem(KEY, '1'); } catch (e) { /* ignore */ }
            if (txt) txt.textContent = 'fetching the latest version…';
            var urls = performance.getEntriesByType('resource').map(function (r) { return r.name; })

            Promise.all(urls.map(function (u) { return fetch(u, { cache: 'reload' }).catch(function () {}); }))
              .then(function () { location.reload(); });
          } else if (txt) txt.textContent = 'could not start: ' + (err || 'unknown error') + ' — please reload';
        }, 1500);
      });
    })();
